<style>
  /*
   * 値と共通部品の正。3つの画面（申請サイドバー・設定サイドバー・機能紹介ダイアログ）が
   * この1ファイルを`<?!= uiTokens ?>`で読み込む。各画面のローカル<style>より前に入るので、
   * ここへ足してからローカル定義を消す順で移すと、途中の状態でも表示が壊れない。
   * 判断の理由はDESIGN.mdに書く。
   */
  :root {
    --color-ink: #162821; --color-muted: #52645B; --color-paper: #F7FAF5;
    --color-field: #FFFFFF; --color-track: #D7E2D9; --color-primary: #146B45;
    --color-primary-dark: #0D4F33; --color-primary-soft: #E8F3EC; --color-focus: rgba(20,107,69,.28);
    --color-warning: #9A5A00; --color-warning-bg: #FFF4D6;
    --color-danger: #B4232C; --color-danger-bg: #FDEBED; --color-clear: #2F6B56;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-6: 24px; --space-8: 32px; --radius-control: 8px; --radius-card: 12px;
    --font-ui: "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif;
    --motion-fast: 140ms ease-out;
  }

  /* 説明枠。「このボタンで何が起きるか」を操作の手前に必ず置くための共通部品。 */
  .explanation { margin: var(--space-3) 0; padding: var(--space-3); background: var(--color-primary-soft); border-left: 7px solid var(--color-primary); border-radius: var(--radius-control); }
  .explanation strong { display: block; margin-bottom: var(--space-1); }
  .explanation ul { margin: var(--space-2) 0 0; padding-left: 1.4em; }
  .explanation li + li { margin-top: var(--space-1); }
  .explanation .caution { margin-top: var(--space-2); color: var(--color-primary-dark); font-weight: 700; }

  /* 折りたたみのヘルプ。読みたい人だけが開く長い説明に使う。 */
  .help { margin-top: var(--space-3); border: 1px solid var(--color-track); border-radius: var(--radius-control); background: var(--color-field); }
  .help > summary { padding: var(--space-2) var(--space-3); min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: 700; border-radius: inherit; }
  .help > summary:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }
  .help[open] > summary { border-bottom: 1px solid var(--color-track); }
  .help-body { padding: var(--space-3); }
  .help-body h4 { margin: var(--space-3) 0 var(--space-1); font-size: .95rem; }
  .help-body h4:first-of-type { margin-top: 0; }
  .help-body p { margin: 0 0 var(--space-2); }
  .help-body dl { margin: 0; display: grid; gap: var(--space-1); }
  .help-body dt { font-weight: 700; }
  .help-body dd { margin: 0 0 var(--space-1); }
  .help-body code { padding: 1px 5px; border-radius: var(--radius-control); background: var(--color-primary-soft); color: var(--color-primary-dark); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92em; word-break: break-word; }
  .help-body ul { margin: 0; padding-left: 1.4em; }
  .help-body li + li { margin-top: var(--space-1); }

  /*
   * 押せない理由。色だけに頼らず、必ず文章で「先に何をすればよいか」を書く（DESIGN.mdの不変条件）。
   * opacityを下げるだけにすると、なぜ押せないのかが分からないまま放置される。
   */
  .blocked-reason { display: block; margin-top: var(--space-2); padding: var(--space-2) var(--space-3); border-left: 5px solid var(--color-warning); background: var(--color-warning-bg); border-radius: var(--radius-control); color: var(--color-ink); font-size: .92rem; }
  .blocked-reason::before { content: "今は使えません："; font-weight: 700; }

  /* 開発用モードだけで使える操作の目印。絵文字は使わず文字で示す。 */
  .badge-dev { display: inline-block; margin-left: var(--space-2); padding: 1px 8px; border-radius: 999px; background: var(--color-warning-bg); color: var(--color-warning); border: 1px solid var(--color-warning); font-size: .78rem; font-weight: 700; vertical-align: middle; }

  /*
   * お知らせ。既定は中立（緑）。危険・失敗は `.notice.error` を付ける。
   * 以前は画面ごとに既定の意味が逆だったため、ここで1つに決める。
   */
  .notice { padding: var(--space-3); border-left: 7px solid var(--color-primary); background: var(--color-primary-soft); border-radius: var(--radius-control); }
  .notice.error { border-left-color: var(--color-danger); background: var(--color-danger-bg); }
  .notice.warning { border-left-color: var(--color-warning); background: var(--color-warning-bg); }

  .spinner { width: 28px; height: 28px; margin: var(--space-8) auto; border: 4px solid var(--color-track); border-top-color: var(--color-primary); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
</style>
