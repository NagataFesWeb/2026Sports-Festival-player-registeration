<!doctype html>
<html lang="ja">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= uiTokens ?>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--color-paper); color: var(--color-ink); font: 16px/1.65 var(--font-ui); }
    button, textarea { font: inherit; }
    button { min-height: 44px; border: 1px solid var(--color-track); border-radius: var(--radius-control); background: var(--color-field); color: var(--color-ink); cursor: pointer; padding: var(--space-2) var(--space-3); transition: transform var(--motion-fast), border-color var(--motion-fast); }
    button:hover { border-color: var(--color-primary); }
    button:active { transform: translateY(1px); }
    button:focus-visible, textarea:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }
    button:disabled { cursor: not-allowed; opacity: .48; transform: none; }
    .primary { background: var(--color-primary); border-color: var(--color-primary); color: white; font-weight: 700; }
    .primary:hover { background: var(--color-primary-dark); }
    .danger { color: var(--color-danger); border-color: var(--color-danger); }
    .shell { max-width: 680px; margin: auto; padding: var(--space-4); }
    header { border-bottom: 4px solid var(--color-primary); padding-bottom: var(--space-3); margin-bottom: var(--space-4); }
    h1 { margin: 0; font-size: 1.35rem; line-height: 1.35; }
    h2 { font-size: 1.05rem; margin: var(--space-6) 0 var(--space-2); }
    p { margin: var(--space-2) 0; }
    .muted { color: var(--color-muted); font-size: .9rem; }
    .counts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); margin-bottom: var(--space-4); }
    .bulk { margin-bottom: var(--space-4); padding: var(--space-4); background: var(--color-primary-soft); border-left: 8px solid var(--color-primary); border-radius: var(--radius-card); }
    .bulk strong { display: block; }
    .bulk button { width: 100%; margin-top: var(--space-3); }
    .cleanup { margin-top: var(--space-6); padding: var(--space-4); background: var(--color-field); border: 1px solid var(--color-track); border-radius: var(--radius-card); }
    .cleanup button { width: 100%; margin-top: var(--space-3); }
    .count { text-align: left; font-weight: 700; }
    .count[data-filter="ERROR"] { border-left: 6px solid var(--color-danger); }
    .count[data-filter="WARNING"] { border-left: 6px solid var(--color-warning); }
    .count[data-filter="REJECTED"] { border-left: 6px solid #6b4f4f; }
    .count[data-filter="APPROVED"] { border-left: 6px solid #315b7d; }
    .count[aria-pressed="true"] { background: var(--color-primary-soft); border-color: var(--color-primary); }
    .list { display: grid; gap: var(--space-3); }
    .submission, .issue { background: var(--color-field); border: 1px solid var(--color-track); border-radius: var(--radius-card); padding: var(--space-4); }
    .submission { width: 100%; text-align: left; }
    .submission strong { display: block; font-size: 1.05rem; }
    .badges { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); }
    .badge { border-radius: 999px; padding: 2px 9px; font-size: .82rem; font-weight: 700; }
    .badge.error { color: var(--color-danger); background: var(--color-danger-bg); }
    .badge.warning { color: var(--color-warning); background: var(--color-warning-bg); }
    .issue { border-left-width: 8px; }
    .issue.error { border-left-color: var(--color-danger); }
    .issue.warning { border-left-color: var(--color-warning); }
    .issue h3 { margin: 0 0 var(--space-2); font-size: 1rem; }
    .submitter { background: var(--color-field); border: 1px solid var(--color-track); border-radius: var(--radius-control); padding: var(--space-3); margin-top: var(--space-3); }
    .submitter p, .issue p { margin: var(--space-1) 0; }
    .issue .location { font-weight: 700; color: var(--color-primary-dark); }
    .issue .message { font-weight: 700; }
    .instruction { white-space: pre-wrap; background: var(--color-paper); padding: var(--space-3); border-radius: var(--radius-control); }
    .comparison { display: grid; gap: var(--space-3); margin-top: var(--space-3); }
    .candidate { background: var(--color-field); border: 2px solid var(--color-track); border-radius: var(--radius-card); padding: var(--space-3); }
    .candidate.current { border-color: var(--color-primary); }
    .candidate h4 { margin: 0; font-size: 1rem; }
    .candidate-list { display: grid; gap: var(--space-2); margin: var(--space-3) 0; }
    .candidate-item { padding-top: var(--space-2); border-top: 1px solid var(--color-track); }
    .candidate-item.focus { border-left: 4px solid var(--color-danger); padding-left: var(--space-3); background: var(--color-danger-bg); }
    .candidate-item.focus.warning-focus { border-left-color: var(--color-warning); background: var(--color-warning-bg); }
    .overlap-choice { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-2); font-weight: 700; }
    .overlap-choice input { width: 20px; min-height: 20px; }
    .overlap-choice span { display: inline; }
    .candidate-item strong, .candidate-item span { display: block; }
    .candidate button { width: 100%; }
    .actions { display: grid; gap: var(--space-2); margin-top: var(--space-4); }
    .actions.secondary { grid-template-columns: 1fr 1fr; }
    input, select, textarea { width: 100%; min-height: 44px; border: 1px solid var(--color-track); border-radius: var(--radius-control); padding: var(--space-3); background: var(--color-field); color: var(--color-ink); font-size: 16px; }
    textarea { min-height: 96px; resize: vertical; }
    .editor { background: var(--color-primary-soft); border: 2px solid var(--color-primary); border-radius: var(--radius-card); padding: var(--space-4); }
    .editor label { display: block; margin-top: var(--space-3); font-weight: 700; }
    .editor .form-actions { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); margin-top: var(--space-4); }
    .global-warning { border-left: 8px solid var(--color-warning); background: var(--color-warning-bg); }
    .student-details { margin-top: var(--space-3); }
    .student-details summary { cursor: pointer; font-weight: 700; color: var(--color-primary-dark); }
    .student-table-wrap { max-height: 380px; overflow: auto; margin-top: var(--space-2); border: 1px solid var(--color-track); border-radius: var(--radius-control); background: var(--color-field); }
    .student-table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    .student-table th, .student-table td { padding: 7px 8px; border-bottom: 1px solid var(--color-track); text-align: left; vertical-align: top; }
    .student-table th { position: sticky; top: 0; background: var(--color-primary-soft); font-weight: 700; }
    .student-table td:nth-child(1), .student-table td:nth-child(2) { white-space: nowrap; }
    .overlap { background: var(--color-primary-soft); border-left: 8px solid var(--color-primary); border-radius: var(--radius-card); padding: var(--space-4); margin-top: var(--space-4); }
    .overlap h2 { margin: 0 0 var(--space-2); }
    .overlap-group { background: var(--color-field); border: 1px solid var(--color-track); border-radius: var(--radius-control); padding: var(--space-3); margin-top: var(--space-3); }
    .overlap-group strong, .overlap-group span { display: block; }
    .overlap-group button { width: 100%; margin-top: var(--space-2); }
    .slot-section { margin-top: var(--space-4); }
    .slot-section > summary { cursor: pointer; font-weight: 700; color: var(--color-primary-dark); min-height: 44px; padding: var(--space-2) 0; }
    .event-group { border: 1px solid var(--color-track); border-radius: var(--radius-card); background: var(--color-field); padding: var(--space-3); margin-top: var(--space-3); }
    .event-group > h4 { margin: 0 0 var(--space-2); font-size: 1rem; }
    .slot { border-left: 6px solid var(--color-track); border-radius: var(--radius-control); background: var(--color-paper); padding: var(--space-2) var(--space-3); margin-top: var(--space-2); }
    .slot strong, .slot span { display: block; }
    .slot.error { border-left-color: var(--color-danger); background: var(--color-danger-bg); }
    .slot.warning { border-left-color: var(--color-warning); background: var(--color-warning-bg); }
    .slot.duplicate:not(.error):not(.warning) { border-left-color: var(--color-primary-dark); }
    .slot button { width: 100%; margin-top: var(--space-2); }
    .tags { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-bottom: var(--space-1); }
    .tag { border-radius: 999px; padding: 2px 9px; font-size: .82rem; font-weight: 700; border: 1px solid transparent; }
    .tag.error { color: var(--color-danger); background: var(--color-danger-bg); border-color: var(--color-danger); }
    .tag.warning { color: var(--color-warning); background: var(--color-warning-bg); border-color: var(--color-warning); }
    .tag.duplicate { color: var(--color-primary-dark); background: var(--color-primary-soft); border-color: var(--color-primary-dark); }
    .reveal { width: 100%; margin-top: var(--space-3); }
    .flash { animation: flash 1.8s ease-out; }
    @keyframes flash { 0%, 100% { box-shadow: none; } 12%, 62% { box-shadow: 0 0 0 4px var(--color-focus); } }
    @media (prefers-reduced-motion: reduce) { .flash { box-shadow: 0 0 0 4px var(--color-focus); } }
    .empty { border: 1px dashed var(--color-track); padding: var(--space-6); text-align: center; }
    .spinner { width: 28px; height: 28px; margin: var(--space-8) auto; border: 4px solid var(--color-track); border-top-color: var(--color-primary); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    @media (min-width: 560px) { .counts { grid-template-columns: repeat(4, 1fr); } .actions { grid-template-columns: 2fr 1fr; } }
  </style>
</head>
<body><main id="app" class="shell" aria-live="polite"></main>
<script>
  const state = { filter: <?!= JSON.stringify(initialFilter || 'ALL') ?>, detail: null };
  const app = document.getElementById('app');
  const labels = {
    INITIAL: '通常登録', CORRECTION: '修正申請', MANUAL_CHANGE: '手動変更',
    PENDING_APPROVAL: '確認待ち', NEEDS_CORRECTION: '修正必要', ON_HOLD: '保留',
    CORRECTION_REQUESTED: '修正依頼済み', REJECTED: '却下', APPROVED: '承認済み', APPLIED: '名簿反映済み'
  };
  /**
   * 説明枠。「このボタンで何が起きるか」を操作の手前へ必ず置く。
   * 見出し・作るもの・変えないものの3点は、設定サイドバーの explanation() と同じ書式にそろえる。
   */
  function explanation(title, items, caution) {
    const box = el('div', 'explanation');
    box.append(el('strong', '', title));
    const list = el('ul');
    items.forEach((item) => list.append(el('li', '', item)));
    box.append(list);
    if (caution) box.append(el('p', 'caution', caution));
    return box;
  }
  /** 押せない理由を、ボタンの直下へ文章で添える。色だけに頼らない。 */
  function blockedReason(button, reason) {
    if (!reason) return null;
    button.disabled = true;
    return el('p', 'blocked-reason', reason);
  }

  /** フォームは学籍番号だけを受け取るため、生徒マスターから引いた氏名を表示する。 */
  function displayStudentName(item) {
    if (item.masterName) return item.masterName;
    if (item.studentNameInput) return `${item.studentNameInput}（入力値）`;
    return item.studentIdInput ? '名簿で確認できません' : '未入力';
  }
  /** 男女別ルールの判定根拠。名簿で確認できない場合は論理式と同じUNKNOWNを表示する。 */
  function displayStudentGender(item) {
    if (item.masterGender === 'M') return '男（M）';
    if (item.masterGender === 'F') return '女（F）';
    return 'UNKNOWN';
  }
  /** 登録する選手だけを男女別に数える。論理式のM・F・UNKNOWNと同じ数え方にする。 */
  function genderBreakdown(items) {
    const registered = items.filter((item) => item.registrationState === 'REGISTER');
    const male = registered.filter((item) => item.masterGender === 'M').length;
    const female = registered.filter((item) => item.masterGender === 'F').length;
    return `男 ${male}人 / 女 ${female}人 / UNKNOWN ${registered.length - male - female}人`;
  }
  const registrationStateLabels = { REGISTER: '選手を登録する', PENDING: '調整中', NOT_PARTICIPATING: '出場しない' };
  const emptyReview = { sameEventDuplicates: [], multiEventStudents: [], issueHighlights: [] };
  const slotElementId = (submissionItemId) => `slot-${submissionItemId}`;
  const eventElementId = (eventId) => `event-${eventId}`;
  const issueElementId = (issueId) => `issue-${issueId}`;
  /**
   * 検査結果と重複の情報を、選手枠ごと・競技ごとに引ける形へまとめる。
   * サーバーが付けた通し番号をそのまま使い、カード見出しの`エラー 1`と枠の目印を一致させる。
   */
  function buildReviewIndex(review) {
    const index = { byIssueId: {}, itemTags: {}, eventTags: {}, duplicateByItemId: {} };
    (review.issueHighlights || []).forEach((highlight) => {
      index.byIssueId[highlight.issueId] = highlight;
      const tag = {
        issueId: highlight.issueId,
        severity: highlight.severity,
        label: `${highlight.severity === 'ERROR' ? 'エラー' : '警告'} ${highlight.displayNumber}`
      };
      (highlight.submissionItemIds || []).forEach((itemId) => {
        (index.itemTags[itemId] = index.itemTags[itemId] || []).push(tag);
      });
      (highlight.eventIds || []).forEach((eventId) => {
        (index.eventTags[eventId] = index.eventTags[eventId] || []).push(tag);
      });
    });
    (review.sameEventDuplicates || []).forEach((group) => {
      (group.slots || []).forEach((slot) => { index.duplicateByItemId[slot.submissionItemId] = group; });
    });
    return index;
  }
  /** 該当箇所へ画面を移動し、一定時間だけ枠を光らせる。色だけに頼らず目印の文字も併記する。 */
  function revealTargets(elementIds) {
    const details = document.getElementById('slot-section');
    if (details && !details.open) details.open = true;
    const nodes = elementIds.map((id) => document.getElementById(id)).filter(Boolean);
    if (!nodes.length) return;
    nodes[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
    nodes.forEach((node) => {
      node.classList.remove('flash');
      void node.offsetWidth;
      node.classList.add('flash');
      setTimeout(() => node.classList.remove('flash'), 2200);
    });
  }
  /** 検査結果1件が指す選手枠・競技の要素IDを返す。特定できない場合は空配列。 */
  function highlightElementIds(highlight) {
    if (!highlight) return [];
    return [
      ...(highlight.submissionItemIds || []).map(slotElementId),
      ...(highlight.eventIds || []).map(eventElementId)
    ];
  }
  /** 検査結果カードへ「該当箇所を表示」を付ける。指す枠がない申請全体の内容には付けない。 */
  function appendRevealButton(card, highlight) {
    const targets = highlightElementIds(highlight);
    if (!targets.length) return;
    const button = el('button', 'reveal', '該当箇所を表示');
    button.onclick = () => revealTargets(targets);
    card.append(button);
  }
  function tagRow(tags, duplicateGroup) {
    if (!tags.length && !duplicateGroup) return null;
    const row = el('div', 'tags');
    tags.forEach((tag) => row.append(el('span', `tag ${tag.severity.toLowerCase()}`, tag.label)));
    if (duplicateGroup) row.append(el('span', 'tag duplicate', duplicateGroup.badgeLabel));
    return row;
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = String(text);
    return node;
  }
  function loading() { app.replaceChildren(el('div', 'spinner')); }
  function showFailure(error) {
    const box = el('div', 'notice error');
    // 疑似データの点検などは1件1行で複数行返すので、改行をそのまま表示する。
    const detail = el('p', '', error && error.message ? error.message : 'スプレッドシートを開き直して、もう一度お試しください。');
    detail.style.whiteSpace = 'pre-line';
    box.append(el('strong', '', '画面を読み込めませんでした。'), detail);
    const retry = el('button', '', 'もう一度読み込む'); retry.onclick = loadDashboard; box.append(retry);
    app.replaceChildren(box);
  }
  function run(name, ...args) {
    return new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));
  }
  function badge(kind, count) { return el('span', `badge ${kind}`, `${kind === 'error' ? 'エラー' : '警告'} ${count}件`); }
  function classFromStudentId(studentId) { const match = String(studentId || '').trim().match(/^([1-3])([1-8])[0-9]{2}$/); return match ? `${match[1]}年${match[2]}組` : '学籍番号から確認できません'; }

  async function loadDashboard(filter = state.filter) {
    state.filter = filter; state.detail = null; loading();
    try { renderDashboard(await run('getDashboardData', filter)); } catch (error) { showFailure(error); }
  }
  function renderDashboard(data) {
    const header = el('header');
    header.append(el('h1', '', '体育祭 選手登録管理'), el('p', 'muted', '件数を押すと、該当する申請だけを表示します。'));
    const guide = el('button', '', 'この管理表でできることを見る');
    guide.onclick = () => run('showFeatureGuide').catch(showFailure);
    header.append(guide);
    if (data.rosterRebuildRequired) {
      header.append(el('div', 'notice error', data.rosterRebuildMessage || '配布用名簿を新しい版で作り直してください。'));
    }
    const counts = el('section', 'counts');
    [['WARNING','警告',data.warning],['ERROR','エラー',data.error],['CLEAR','問題なし',data.clear],['HOLD','保留',data.hold],['REJECTED','却下済み',data.rejected],['APPROVED','承認済み',data.approved]].forEach(([filter,label,count]) => {
      const button = el('button', 'count', `${label} ${count}件`); button.dataset.filter = filter; button.setAttribute('aria-pressed', String(state.filter === filter)); button.onclick = () => loadDashboard(filter); counts.append(button);
    });
    const list = el('section', 'list');
    (data.globalWarnings || []).forEach((warning) => {
      const card = el('article', 'issue warning global-warning');
      card.append(
        el('h3', '', '全体の警告 1件'),
        el('p', 'message', warning.title),
        el('p', '', warning.message),
        el('strong', '', '確認方法'),
        el('p', '', warning.fixInstruction)
      );
      const students = warning.affectedStudents || [];
      if (students.length) {
        const details = el('details', 'student-details');
        details.open = students.length <= 10;
        details.append(el('summary', '', `出場していない生徒を確認する（${students.length}人）`));
        const wrap = el('div', 'student-table-wrap');
        const table = el('table', 'student-table');
        const head = el('thead');
        const headRow = el('tr');
        ['クラス', '学籍番号', '氏名'].forEach((label) => headRow.append(el('th', '', label)));
        head.append(headRow);
        const body = el('tbody');
        students.forEach((student) => {
          const row = el('tr');
          row.append(
            el('td', '', `${student.grade}年${student.classNumber}組`),
            el('td', '', student.studentId),
            el('td', '', student.name)
          );
          body.append(row);
        });
        table.append(head, body); wrap.append(table); details.append(wrap); card.append(details);
      }
      list.append(card);
    });
    if (!data.submissions.length && !(data.globalWarnings || []).length) list.append(el('div', 'empty', 'この条件に当てはまる未処理申請はありません。'));
    data.submissions.forEach((submission) => {
      const button = el('button', 'submission');
      button.append(el('strong', '', `${submission.targetGrade}年${submission.targetClass}組 ${labels[submission.submissionType] || submission.submissionType}`), el('span', 'muted', `${labels[submission.status] || submission.status} ・ ${formatDate(submission.submittedAt)}`));
      const badges = el('span', 'badges'); badges.append(badge('warning', submission.warningCount), badge('error', submission.errorCount)); button.append(badges);
      button.onclick = () => loadDetail(submission.submissionId); list.append(button);
    });
    const children = [header, counts];
    if (data.clear > 0) {
      const bulk = el('section', 'bulk');
      bulk.append(el('strong', '', `問題なしの申請が${data.clear}件あります`));
      bulk.append(explanation('このボタンで行うこと', [
        '警告0件・エラー0件の申請だけを、処理の直前にもう一度検査してからまとめて承認します。',
        '承認した申請は「登録データ」へ反映し、「承認履歴」へ1行ずつ記録します。',
        '検査で警告またはエラーが見つかった申請は承認しません。',
      ], '帳票は変わりません。名簿は「承認済みから選手名簿を作成」で別に作ります。'));
      const approveAll = el('button', 'primary', `問題なし ${data.clear}件をまとめて承認する`);
      approveAll.onclick = () => approveAllClear(data.clear); bulk.append(approveAll); children.push(bulk);
    }
    children.push(list);
    // 疑似データの操作は開発用モードのときだけ出す。本番モードではサーバー側でも禁止しており、
    // 押せてしまう場所を残すと事故のもとになる。
    const environment = data.environment || { mode: 'DEVELOPMENT', mockSubmissionsExist: true, rosterSourceLabel: '疑似生徒マスター' };
    if (environment.mode !== 'PRODUCTION') {
      const noMock = environment.mockSubmissionsExist
        ? '' : '疑似申請がありません。先にメニューの「開発用の疑似データを作る」を実行してください。';

      const addMock = el('section', 'cleanup');
      const addMockTitle = el('h2', '', '追加の疑似修正申請を試す');
      addMockTitle.append(el('span', 'badge-dev', '開発用'));
      addMock.append(addMockTitle);
      addMock.append(explanation('このボタンで行うこと', [
        '今ある疑似申請と操作履歴を残したまま、修正フォームが後から届いた想定の申請を追加します。',
        `追加する選手は「${environment.rosterSourceLabel}」から選びます。`,
        '意図的なエラー・警告は付けません。現在の設定上必要な欠員警告などは出る場合があります。',

        '照合に使う疑似生徒マスターは残します。',
      ], '競技・ルール設定、フォーム、フォーム項目対応表、登録データ、帳票、本番用の「生徒マスター」は変わりません。'));
      const prepareFormTest = el('button', 'primary', '疑似申請を削除して本物のフォーム確認へ');
      prepareFormTest.onclick = prepareRealFormTest;

      if (prepareBlocked) cleanup.append(prepareBlocked);
      cleanup.append(explanation('「完全に削除する」で行うこと', [
        '疑似生徒マスターと、疑似のフォーム回答・承認待ち・申請項目・検査結果・承認履歴・変更履歴をすべて消します。',
        '疑似申請に使う名簿を切り替える前には、必ずこれを実行してください。',
      ], '元に戻せません。競技・ルール設定、フォーム、登録データ、帳票、本番用の「生徒マスター」は残ります。'));

      deleteMock.onclick = deleteAllMockData;
      cleanup.append(deleteMock);
      const deleteBlocked = blockedReason(deleteMock, noMock);

  }

      );
    }
    header.append(submitter);
    const hasDuplicates = detail.duplicateCandidates && detail.duplicateCandidates.length > 1;
    const isRejected = detail.submission.status === 'REJECTED';
    const rejection = [...(detail.approvalHistory || [])].reverse().find((record) => record.action === 'REJECT' || record.action.includes('不採用'));
    const summary = el('section', detail.submission.errorCount || hasDuplicates || isRejected ? 'notice error' : 'notice');
    summary.append(
      el('strong', '', isRejected ? 'この申請は却下済みです。' : hasDuplicates ? '先に、採用する回答を1件選んでください。' : detail.submission.errorCount ? 'この申請はそのまま承認できません。' : 'この申請は承認できます。'),
      el('p', '', isRejected ? '内容をもう一度確認する場合は、下の「確認待ちに戻す」を押してください。戻した直後に自動で再検査します。' : hasDuplicates ? '同じクラスの回答を下に並べています。送信日時と選手内容を比べて選んでください。' : detail.submission.errorCount ? '各エラーに表示された登録一覧を確認し、必要な項目を修正してください。' : '警告がある場合は内容を確認してから承認してください。')
    );
    if (isRejected && rejection) summary.append(
      el('strong', '', '前回の却下内容'),
      el('p', '', `理由：${rejection.reason || '理由の記録なし'}`),

    );
    const badges = el('div', 'badges'); badges.append(badge('warning', detail.submission.warningCount), badge('error', detail.submission.errorCount)); summary.prepend(badges);
    const issues = el('section', 'list'); issues.append(el('h2', '', '確認する内容'));
    if (!detail.issues.length) issues.append(el('div', 'empty', '検査で問題は見つかりませんでした。'));
    const issueNumber = { WARNING: 0, ERROR: 0 };
    detail.issues.forEach((issue) => {
      issueNumber[issue.severity] += 1;
      const highlight = index.byIssueId[issue.issueId];
      const number = highlight ? highlight.displayNumber : issueNumber[issue.severity];
      if (issue.issueCode === 'RULE_EXPRESSION_FALSE') {
        // ルールは論理式だけで決まるため、判定に使った競技の登録内容をそのまま並べて直せるようにする。
        const targetEventIds = new Set(highlight ? highlight.eventIds : []);

        // どちらの側も前後の空白を落としてから照合する。

        const focusIds = new Set(highlight ? highlight.submissionItemIds : []);
        const targetItems = detail.items.filter((candidate) =>
          (targetEventIds.size ? targetEventIds.has(candidate.eventId) : targetEvents.has(trimmedName(candidate.eventName)))
          && candidate.registrationState !== 'NOT_PARTICIPATING');
        const focusItems = targetItems.filter((candidate) => focusIds.has(candidate.submissionItemId));
        const card = el('article', `issue ${issue.severity.toLowerCase()}`);
        card.id = issueElementId(issue.issueId);
        card.append(
          el('h3', '', `${issue.severity === 'ERROR' ? 'エラー' : '警告'} ${number}`),
          el('p', 'message', `問題メッセージ：${issue.displayTitle}`),
          el('p', '', `対象：${issue.locationText || '対象競技'}（${targetItems.length}件の登録）`),
          el('p', '', `性別の内訳：${genderBreakdown(targetItems)}`),
          el('p', focusItems.length ? 'message' : 'muted', focusItems.length
            ? `直す枠：${focusItems.length}件（下の一覧で色が付いている枠です）`
            : '直す枠を1つに絞れませんでした。条件が足りていない可能性があるため、下の一覧全体を見直してください。')
        );
        const list = el('div', 'candidate-list');
        // 全競技を対象にしたルールでは対象が100件を超えることがある。
        // 直す枠が分かっている場合は、その枠と同じ競技の登録だけを並べる。
        const focusEventIds = new Set(focusItems.map((candidate) => candidate.eventId));
        const listedItems = focusItems.length && targetItems.length > 20
          ? targetItems.filter((candidate) => focusIds.has(candidate.submissionItemId) || focusEventIds.has(candidate.eventId))
          : targetItems;
        if (listedItems.length < targetItems.length) {
          card.append(el('p', 'muted', `下の一覧は、直す枠と同じ競技の${listedItems.length}件だけを表示しています（対象は全${targetItems.length}件）。`));
        }
        // 直す枠を先頭へ出す。50件の中から探させない。
        const ordered = [...focusItems, ...listedItems.filter((candidate) => !focusIds.has(candidate.submissionItemId))];
        ordered.forEach((item) => {
          const isFocus = focusIds.has(item.submissionItemId);
          const row = el('div', `candidate-item${isFocus ? ' focus' : ''}${isFocus && issue.severity === 'WARNING' ? ' warning-focus' : ''}`);

          }

            const edit = el('button', 'primary', 'この項目を修正');

            row.append(edit);
          }
          list.append(row);
        });
        card.append(list, el('div', 'instruction', `修正方法：${issue.fixInstruction}`));
        appendRevealButton(card, highlight);

      }
      if (issue.issueCode === 'MULTIPLE_INITIAL_SUBMISSIONS') {

        card.id = issueElementId(issue.issueId);
        card.append(

      }
      const submissionLevelIssue = issue.issueCode === 'PROXY_SUBMISSION' || !issue.submissionItemId;
      const item = submissionLevelIssue ? undefined : detail.items.find((candidate) => candidate.submissionItemId === issue.submissionItemId);
      // 1件で複数の枠を指す検査結果（欠員警告など）は、対応付けた枠名を「場所」に出す。
      const targetItems = item ? [] : (highlight ? highlight.submissionItemIds : [])
        .map((itemId) => detail.items.find((candidate) => candidate.submissionItemId === itemId))
        .filter(Boolean);
      const targetSlotNames = targetItems.map((candidate) => candidate.slotName).join('、');
      const targetEventNames = [...new Set(targetItems.map((candidate) => candidate.eventName))].join('、');
      const card = el('article', `issue ${issue.severity.toLowerCase()}`);

      card.append(
        el('h3', '', `${issue.severity === 'ERROR' ? 'エラー' : '警告'} ${number}`),
        el('p', 'location', `競技：${item?.eventName || targetEventNames || issue.locationText}`),
        el('p', 'location', `場所：${item?.slotName || targetSlotNames || '申請全体'}`),
        ...(item ? [el('p', '', `登録状態：${registrationStateLabels[item.registrationState] || item.registrationState}`)] : []),
        el('p', '', item

  /**
   * まだ登録していない登録申請と、あとから届いた修正申請の突き合わせ。
   * すでに登録済みのクラスでは、登録済みの内容と修正申請を並べて見せるだけにする。
   */
  function buildCorrectionOverlapSection(detail, isRejected) {
    const overlap = detail.correctionOverlap;
    if (!overlap || !overlap.rows || !overlap.rows.length) return null;
    const registered = overlap.baseKind === 'REGISTRATION';
    const baseLabel = registered ? '登録済みの内容' : '登録申請';
    const section = el('section', 'overlap');
    section.append(el('h2', '', `${baseLabel}と修正申請の突き合わせ`));
    section.append(el('p', '', registered
      ? `このクラスはすでに登録済みです。承認すると、この修正申請に含まれる競技は下の「修正申請」の内容へ置き換わります。内容が違う枠は${overlap.changedCount}件です。`
      : `まだ登録していない登録申請（${formatDate(overlap.baseSubmittedAt)}送信）と、あとから届いた修正申請（${formatDate(overlap.correctionSubmittedAt)}送信）が同じ枠を指しています。内容が違う枠は${overlap.changedCount}件です。`));
    if (!registered) {
      section.append(el('p', '', overlap.baseErrorCount
        ? `このうち${overlap.baseErrorCount}件は登録申請でエラーになっている枠です。修正申請の内容を取り込むと、登録申請のまま承認できるようになります。`
        : '取り込んだ枠は登録申請の内容として保存され、取り込まなかった枠は登録申請のまま残ります。'));
    }
    if (overlap.baseStaleMessage) {
      section.append(el('p', 'message', `注意：${overlap.baseStaleMessage}`));
    }

    let showAll = false;
    const list = el('div', 'candidate-list');
    const checkboxes = new Map();
    const render = () => {
      checkboxes.clear();
      const rows = overlap.rows.filter((row) => showAll || row.changed);
      const nodes = rows.map((row) => {
        const item = el('div', `candidate-item${row.changed ? ' focus' : ''}${row.changed && !row.baseHasError ? ' warning-focus' : ''}`);
        const tags = [];
        if (row.baseHasError) tags.push({ severity: 'ERROR', label: '登録申請がエラー' });
        else if (row.changed) tags.push({ severity: 'WARNING', label: '内容が違います' });
        const tagLine = tagRow(tags, null);
        if (tagLine) item.append(tagLine);
        item.append(
          el('strong', '', `${row.eventName} / ${row.slotName}`),
          el('span', '', `${baseLabel}：${describeOverlapSide(row.baseExists, row.baseStudentId, row.baseStudentName, row.baseState)}`),
          el('span', '', `修正申請：${describeOverlapSide(true, row.correctionStudentId, row.correctionStudentName, row.correctionState)}`)
        );
        if (overlap.canImport && !isRejected && row.changed) {
          const label = el('label', 'overlap-choice');
          const box = document.createElement('input');
          box.type = 'checkbox';
          box.checked = Boolean(row.baseHasError);
          box.id = `overlap-${row.correctionItemId}`;
          label.append(box, el('span', '', 'この枠は修正申請の内容にする'));
          item.append(label);
          checkboxes.set(row.correctionItemId, box);
        }
        return item;
      });
      if (!nodes.length) nodes.push(el('div', 'empty', '内容が違う枠はありません。'));
      list.replaceChildren(...nodes);
    };
    render();

    const toggle = el('button', '', 'すべての枠を表示する');
    toggle.onclick = () => {
      showAll = !showAll;
      toggle.textContent = showAll ? '内容が違う枠だけ表示する' : 'すべての枠を表示する';
      render();
    };
    section.append(list, toggle);

    if (overlap.canImport && !isRejected) {
      const form = el('div', 'editor');
      const reason = document.createElement('textarea');
      reason.placeholder = '取り込む理由（例：クラス担当へ確認し、修正フォームの内容を採用）';
      const selectAll = el('button', '', '内容が違う枠をすべて選ぶ');
      selectAll.onclick = () => checkboxes.forEach((box) => { box.checked = true; });
      const submit = el('button', 'primary', '選んだ枠を登録申請へ取り込む');
      submit.onclick = () => importCorrection(overlap, checkboxes, reason.value);
      form.append(
        el('strong', '', '選んだ枠を登録申請へ取り込む'),
        el('p', 'muted', '取り込むと、登録申請の該当枠が修正申請の内容に置き換わり、変更履歴に残ります。'),
        reason, selectAll, submit
      );
      section.append(form);
    }
    return section;
  }

  function describeOverlapSide(exists, studentId, studentName, state) {
    if (!exists) return 'この枠はありません';
    if (state === 'NOT_PARTICIPATING') return '出場しない';
    if (!studentId) return '未入力';
    return `${studentId} ${studentName || '氏名を確認できません'}${state === 'PENDING' ? '（調整中）' : ''}`;
  }

  async function importCorrection(overlap, checkboxes, reason) {
    const selected = [...checkboxes.entries()].filter(([, box]) => box.checked).map(([id]) => id);
    if (!selected.length) { window.alert('取り込む枠を1つ以上選んでください。'); return; }
    if (!String(reason || '').trim()) { window.alert('取り込む理由を入力してください。'); return; }
    if (!window.confirm(`${selected.length}件の枠を、修正申請の内容で登録申請へ取り込みます。よろしいですか？`)) return;
    loading();
    try {
      const result = await run('importCorrectionSlots',
        overlap.correctionSubmissionId, overlap.baseSubmissionId, selected, reason);
      window.alert(result.message);
      await loadDetail(result.targetSubmissionId);
    } catch (error) { showFailure(error); }
  }
  /**
   * 同じ生徒がどこに何回登録されているかをまとめて見せる。
   * 良し悪しの判定は`ルール設定`の論理式が行うため、この欄は事実だけを中立に表示する。
   */
  function buildOverlapSection(detail, review) {
    const section = el('section', 'overlap');
    section.append(el('h2', '', '同じ生徒の重なりを確認する'));
    const duplicates = review.sameEventDuplicates || [];
    const multiEvent = review.multiEventStudents || [];
    if (!duplicates.length) {
      section.append(el('p', '', '同じ競技の中で同じ生徒が複数の枠に入っている箇所はありません。'));
    } else {
      section.append(
        el('p', 'message', `同じ競技の中で同じ生徒が複数の枠に入っています（${duplicates.length}件）。`),
        el('p', 'muted', '意図した登録かどうかを確認してください。禁止するルールを設定している場合は、上のエラーまたは警告にも表示されます。')
      );
      duplicates.forEach((group) => {
        const card = el('div', 'overlap-group');
        const tags = el('div', 'tags');
        tags.append(el('span', 'tag duplicate', group.badgeLabel));
        card.append(
          tags,
          el('strong', '', `${group.eventName}：同じ生徒が${group.count}回`),
          el('span', '', `学籍番号：${group.studentId}`),
          el('span', '', `名簿の氏名：${group.name || '名簿で確認できません'}`),
          el('span', '', `性別：${genderLabel(group.gender)}`),
          el('span', '', `登録されている枠：${group.slots.map((slot) => slot.slotName).join('、')}`)
        );
        const reveal = el('button', '', '該当箇所を表示');
        reveal.onclick = () => revealTargets(group.slots.map((slot) => slotElementId(slot.submissionItemId)));
        card.append(reveal);
        section.append(card);
      });
    }
    if (multiEvent.length) {
      const details = el('details', 'student-details');
      details.append(el('summary', '', `複数の競技に出場する生徒を確認する（${multiEvent.length}人）`));
      details.append(el('p', 'muted', '競技をまたいだ出場は重複ではありません。出場数を制限する場合は「ルール設定」の論理式で決めます。'));
      multiEvent.forEach((student) => {
        const card = el('div', 'overlap-group');
        card.append(
          el('strong', '', `${student.studentId}　${student.name || '名簿で確認できません'}（${genderLabel(student.gender)}）`),
          el('span', '', `出場する競技：${student.eventCount}競技`),
          el('span', 'muted', student.slots.map((slot) => `${slot.eventName} / ${slot.slotName}`).join('、'))
        );
        const reveal = el('button', '', '該当箇所を表示');
        reveal.onclick = () => revealTargets(student.slots.map((slot) => slotElementId(slot.submissionItemId)));
        card.append(reveal);
        details.append(card);
      });
      section.append(details);
    }
    return section;
  }
  function genderLabel(gender) {
    if (gender === 'M') return '男（M）';
    if (gender === 'F') return '女（F）';
    return 'UNKNOWN';
  }
  /**
   * 申請の全選手枠を競技ごとに並べ、エラー・警告・重複のある場所へ目印と色を付ける。
   * 枠数が多いと縦に長くなるため、既定では折りたたみ、「該当箇所を表示」から自動で開く。
   */
  function buildSlotSection(detail, index, isRejected) {
    const section = el('details', 'slot-section');
    section.id = 'slot-section';
    const problemCount = Object.keys(index.itemTags).length;
    section.open = detail.items.length <= 12;
    section.append(el('summary', '', `登録内容の一覧を開く（全${detail.items.length}枠${problemCount ? ` / 問題のある枠 ${problemCount}` : ''}）`));
    section.append(el('p', 'muted', 'エラーは赤、警告は黄色の線と目印を付けています。目印の番号は上のカードの番号と同じです。'));
    const eventOrder = [];
    const itemsByEvent = {};
    detail.items.forEach((item) => {
      if (!itemsByEvent[item.eventId]) { itemsByEvent[item.eventId] = []; eventOrder.push(item.eventId); }
      itemsByEvent[item.eventId].push(item);
    });
    eventOrder.forEach((eventId) => {
      const eventItems = itemsByEvent[eventId];
      const group = el('div', 'event-group');
      group.id = eventElementId(eventId);
      const eventTags = tagRow(index.eventTags[eventId] || [], null);
      if (eventTags) group.append(eventTags);
      group.append(el('h4', '', eventItems[0].eventName));
      eventItems.forEach((item) => {
        const tags = index.itemTags[item.submissionItemId] || [];
        const duplicateGroup = index.duplicateByItemId[item.submissionItemId];
        const severity = tags.some((tag) => tag.severity === 'ERROR') ? 'error'
          : tags.some((tag) => tag.severity === 'WARNING') ? 'warning' : '';
        const row = el('div', `slot ${severity}${duplicateGroup ? ' duplicate' : ''}`.trim());
        row.id = slotElementId(item.submissionItemId);
        const tagLine = tagRow(tags, duplicateGroup);
        if (tagLine) row.append(tagLine);
        row.append(
          el('strong', '', item.slotName),
          el('span', '', `学籍番号：${item.studentIdInput || '未入力'}`),
          el('span', '', `名簿の氏名：${displayStudentName(item)}`),
          el('span', '', `性別：${displayStudentGender(item)}`),
          el('span', 'muted', `登録状態：${registrationStateLabels[item.registrationState] || item.registrationState}`)
        );
        if ((tags.length || duplicateGroup) && !isRejected) {
          const edit = el('button', 'primary', 'この項目を修正');
          edit.onclick = () => showEditor(item);
          row.append(edit);
        }
        group.append(row);
      });
      section.append(group);
    });
    return section;
  }
  function buildDuplicateComparison(detail) {
    const wrap = el('div', 'comparison');
    detail.duplicateCandidates.forEach((candidate, index) => {
      const current = candidate.submission.submissionId === detail.submission.submissionId;
      const card = el('section', `candidate ${current ? 'current' : ''}`);
      card.append(
        el('h4', '', `回答 ${index + 1}${current ? '（現在開いている回答）' : ''}`),
        el('p', 'muted', `送信日時：${formatDate(candidate.submission.submittedAt)}`),
        el('p', '', `入力者：${candidate.submission.submitterStudentId || '未入力'} ${candidate.submission.submitterNameInput || '未入力'}`)
      );
      const list = el('div', 'candidate-list');
      candidate.items.forEach((item) => {
        const row = el('div', 'candidate-item');
        row.append(
          el('strong', '', `${item.eventName} / ${item.slotName}`),
          el('span', '', `学籍番号：${item.studentIdInput || '未入力'}`),
          el('span', '', `名簿の氏名：${displayStudentName(item)}`),
          el('span', '', `性別：${displayStudentGender(item)}`),
          el('span', 'muted', `登録状態：${registrationStateLabels[item.registrationState] || item.registrationState}`)
        );
        list.append(row);
      });
      card.append(list);
      const select = el('button', 'primary', 'この回答を採用する');
      select.onclick = () => selectDuplicate(candidate.submission);
      card.append(select); wrap.append(card);
    });
    return wrap;
  }
  async function selectDuplicate(submission) {
    if (!window.confirm(`${formatDate(submission.submittedAt)}に送信された回答を採用します。\n\nほかの同一クラス回答は不採用になります。よろしいですか？`)) return;
    loading();
    try {
      await run('selectDuplicateSubmission', submission.submissionId);
    } catch (error) { showFailure(error); return; }
    await loadDetail(submission.submissionId);
  }
  function showEditor(item) {
    document.querySelector('.editor')?.remove();
    const editor = el('section', 'editor');
    editor.append(
      el('h2', '', 'この項目を修正'),
      el('p', 'muted', '修正内容と理由を保存すると、変更前後を変更履歴に記録して再検査します。'),
      el('p', 'muted', `現在の登録：${item.eventName} / ${item.slotName}　${displayStudentName(item)}　性別：${displayStudentGender(item)}`)
    );
    const idLabel = el('label', '', '選手の学籍番号');
    const idInput = document.createElement('input'); idInput.type = 'text'; idInput.inputMode = 'numeric'; idInput.value = item.studentIdInput;
    idLabel.append(idInput);
    const stateLabel = el('label', '', '登録状態');
    const stateSelect = document.createElement('select');
    [['REGISTER', '選手を登録する'], ['PENDING', '調整中'], ['NOT_PARTICIPATING', '出場しない']].forEach(([value, label]) => {
      const option = document.createElement('option'); option.value = value; option.textContent = label; option.selected = item.registrationState === value; stateSelect.append(option);
    });
    stateLabel.append(stateSelect);
    const reasonLabel = el('label', '', '修正理由（必須）');
    const reasonInput = document.createElement('textarea'); reasonInput.placeholder = '例：代表者が登録状態を最終確認したため'; reasonLabel.append(reasonInput);
    const actions = el('div', 'form-actions');
    const cancel = el('button', '', 'キャンセル'); cancel.onclick = () => editor.remove();
    const save = el('button', 'primary', '保存して再検査');
    save.onclick = async () => {
      if (!reasonInput.value.trim()) { window.alert('修正理由を入力してください。'); reasonInput.focus(); return; }
      save.disabled = true;
      try {
        await run('editSubmissionItem', state.detail.submission.submissionId, item.submissionItemId, idInput.value, stateSelect.value, reasonInput.value);
        await loadDetail(state.detail.submission.submissionId);
      } catch (error) { showFailure(error); }
    };
    actions.append(cancel, save); editor.append(idLabel, stateLabel, reasonLabel, actions); app.append(editor); editor.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function buildActions(detail) {
    const section = el('section'); section.append(el('h2', '', 'この申請をどうしますか'));
    if (detail.submission.status === 'APPROVED' || detail.submission.status === 'APPLIED') {
      section.append(el('p', 'notice', detail.submission.status === 'APPLIED'
        ? 'この申請は承認済みで、登録データと名簿への反映も完了しています。'
        : 'この申請は承認済みです。次に選手名簿を作成すると登録データへ反映されます。'));
      const reopen = el('button', detail.submission.status === 'APPLIED' ? 'danger' : '', '承認を取り消して確認待ちに戻す');
      reopen.onclick = () => act('REOPEN_APPROVED', true);
      const actions = el('div', 'actions'); actions.append(reopen);
      section.append(actions, el('p', 'muted', detail.submission.status === 'APPLIED'
        ? '登録データを残りの名簿反映済み申請から作り直します。作成済みPDFは旧版として残るため、修正・再承認後に新しい名簿版を作成してください。'
        : '戻す理由と実行者・日時を履歴へ残し、現在の内容を再検査します。'));
      return section;
    }
    if (detail.submission.status === 'REJECTED') {
      const restore = el('button', 'primary', '確認待ちに戻す');
      restore.onclick = () => act('RESTORE', true);
      const actions = el('div', 'actions'); actions.append(restore);
      section.append(actions, el('p', 'muted', '戻す理由と実行者・日時を履歴へ保存し、現在の入力内容を再検査します。エラーがあれば「修正必要」として戻ります。'));
      return section;
    }
    const isOnHold = detail.submission.status === 'ON_HOLD';
    const hasDuplicates = detail.duplicateCandidates && detail.duplicateCandidates.length > 1;
    const approve = el('button', 'primary', isOnHold ? '確認を再開する' : '承認する');
    approve.disabled = !isOnHold && (detail.submission.errorCount > 0 || hasDuplicates);
    approve.onclick = () => act(
      isOnHold ? 'RESUME' : 'APPROVE',
      !isOnHold && detail.submission.warningCount > 0
    );
    const hold = el('button', '', '保留にする'); hold.onclick = () => act('HOLD', false);
    const reject = el('button', 'danger', '却下する'); reject.onclick = () => act('REJECT', true);
    const actions = el('div', 'actions'); actions.append(approve); if (!isOnHold) actions.append(hold); actions.append(reject); section.append(actions, el('p', 'muted', hasDuplicates ? '採用する回答を選ぶと、ほかの回答は不採用として履歴に残ります。' : '承認しても、今回の実装範囲では正式名簿と帳票はまだ更新されません。'));
    return section;
  }
  async function openIssue(issue) {
    const item = state.detail.items.find((candidate) => candidate.submissionItemId === issue.submissionItemId);
    if (item) { showEditor(item); return; }
    loading();
    try {
      await run('openIssueLocation', state.detail.submission.submissionId, issue.submissionItemId || '');
      google.script.host.close();
    } catch (error) { showFailure(error); }
  }
  async function act(action, needsReason) {
    let reason = '';
    if (needsReason) {
      const promptText = action === 'RESTORE'
        ? '確認待ちに戻す理由を入力してください。'
        : action === 'REOPEN_APPROVED'
          ? '承認を取り消して確認待ちに戻す理由を入力してください。'
        : action === 'APPROVE'
          ? '警告を確認したうえで承認する理由を入力してください。\n例：欠員で正しいことを担当者へ確認済み'
          : '却下する理由を入力してください。';
      reason = window.prompt(promptText, '') || '';
      if (!reason.trim()) return;
    }
    const message = { APPROVE: 'この申請を承認しますか。', HOLD: 'この申請を保留にしますか。', REJECT: 'この申請を却下しますか。', RESUME: 'この申請の確認を再開しますか。', RESTORE: '却下済み申請を確認待ちへ戻し、もう一度検査しますか。', REOPEN_APPROVED: state.detail.submission.status === 'APPLIED' ? 'この申請は名簿反映済みです。承認を取り消すと登録データを作り直します。作成済みPDFは旧版として残ります。続けますか。' : 'この申請の承認を取り消し、確認待ちへ戻してもう一度検査しますか。' }[action];
    if (!window.confirm(message)) return;
    loading();
    try { await run('performSubmissionAction', state.detail.submission.submissionId, action, reason); await loadDashboard('ALL'); } catch (error) { showFailure(error); }
  }
  function formatDate(value) { const d = new Date(value); return Number.isNaN(d.getTime()) ? value : new Intl.DateTimeFormat('ja-JP', { dateStyle: 'short', timeStyle: 'short', timeZone: 'Asia/Tokyo' }).format(d); }
  loadDashboard(state.filter);
</script></body></html>
